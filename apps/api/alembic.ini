# Alembic configuration.
#
# There is deliberately NO database URL in this file: migrations/env.py reads DATABASE_URL from
# the environment or the git-ignored .env file (same settings as the API). Never put credentials
# in this file.
#
# Run from apps/api (works the same on Windows PowerShell):
#   python -m alembic upgrade head
#   python -m alembic current
#   python -m alembic downgrade -1

[alembic]
script_location = %(here)s/migrations
file_template = %%(rev)s_%%(slug)s
prepend_sys_path = .
path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
