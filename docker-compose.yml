# PostgreSQL + PostGIS for local development.
# Credentials come from your git-ignored `.env` file (see .env.example). Nothing secret lives here.
services:
  db:
    image: postgis/postgis:16-3.4
    container_name: atlas-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-atlas}
      POSTGRES_DB: ${POSTGRES_DB:-atlas}
      # `:?` makes Compose fail fast with a clear message instead of starting with a blank password.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env (see .env.example)}
    ports:
      # Bound to localhost only, so the database is not exposed to your network.
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - atlas_pgdata:/var/lib/postgresql/data
      - ./infra/db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 12

volumes:
  atlas_pgdata:
